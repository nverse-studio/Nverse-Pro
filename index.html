<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>南辞引导页演示</title>
    <style>
        /* 基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* 这里换成你自己的二次元红色枫叶背景图 */
            background-image: url('https://images.unsplash.com/photo-1542272201-b1ca555f8505?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            color: #fff;
            overflow-x: hidden;
        }

        /* 模拟手机屏幕容器，如果在电脑上看限制宽度 */
        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            /* 顶部加一点暗色渐变，让白字更清晰 */
            background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.6) 100%);
        }

        /* 顶部标题区 */
        .header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .title {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .title span {
            color: #ff4757; /* 导航站标题的红色 */
        }

        .welcome-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .subtitle {
            margin-top: 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .subtitle .icon {
            width: 16px;
            height: 16px;
            fill: #fff;
        }

        /* 中间四宫格信息区 */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
        }

        .info-item .icon {
            width: 18px;
            height: 18px;
        }

        /* 底部按钮列表区 */
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: auto; /* 将按钮推到底部 */
        }

        .glass-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50px; /* 大圆角 */
            text-decoration: none;
            color: #fff;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .glass-button:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.25);
        }

        .btn-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* 图标容器 */
        .icon-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 24px;
            height: 24px;
        }
        
        .icon-wrapper svg {
            width: 100%;
            height: 100%;
        }

        .btn-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .btn-title {
            font-size: 15px;
            font-weight: 500;
        }

        .btn-subtitle {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
        }

        .arrow-icon {
            width: 16px;
            height: 16px;
            fill: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- 顶部标题区 -->
        <div class="header">
            <h1 class="title">NANCI<span>引导页</span></h1>
            <div class="welcome-badge">
                ✦ 欢迎你的到来 ✦
            </div>
            
            <div class="subtitle">
                <!-- 靶心图标 SVG -->
                <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                独立开发你的引导页
                <span style="opacity: 0.6;">|</span>
                <span>一键定制你的引导页</span>
            </div>
        </div>

        <!-- 四宫格信息卡片 -->
        <div class="info-grid">
            <div class="info-item">
                <!-- 闪电图标 -->
                <svg class="icon" viewBox="0 0 24 24" fill="#FFD700"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
                24小时不间断提供服务
            </div>
            <div class="info-item">
                <!-- 锁图标 -->
                <svg class="icon" viewBox="0 0 24 24" fill="#FFD700"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
                24小时在线
            </div>
            <div class="info-item">
                <!-- 盾牌图标 -->
                <svg class="icon" viewBox="0 0 24 24" fill="#A0D2FF"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                稳定项目
            </div>
            <div class="info-item">
                <!-- 握手/服务图标 -->
                <svg class="icon" viewBox="0 0 24 24" fill="#A0D2FF"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
                稳定域名
            </div>
        </div>

        <!-- 底部毛玻璃按钮组 -->
        <div class="link-list">
            
            <!-- 官方通知频道 -->
            <a href="#" class="glass-button">
                <div class="btn-left">
                    <div class="icon-wrapper">
                        <!-- 喇叭图标 -->
                        <svg viewBox="0 0 24 24" fill="#ff4757"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/><path d="M9.5 9.5l-2 2 2 2" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </div>
                    <div class="btn-text">
                        <span class="btn-title">官方通知频道</span>
                        <span class="btn-subtitle">@NANCI123 加入</span>
                    </div>
                </div>
                <!-- 右箭头 -->
                <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </a>

            <!-- 卡网入口 -->
            <a href="#" class="glass-button">
                <div class="btn-left">
                    <div class="icon-wrapper">
                        <!-- 包裹图标 -->
                        <svg viewBox="0 0 24 24" fill="#D4A373"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                    </div>
                    <div class="btn-text">
                        <span class="btn-title">卡网入口</span>
                        <span class="btn-subtitle">点击进入</span>
                    </div>
                </div>
                <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </a>

            <!-- QQ售后群 -->
            <a href="#" class="glass-button">
                <div class="btn-left">
                    <div class="icon-wrapper">
                        <!-- 双人图标 -->
                        <svg viewBox="0 0 24 24" fill="#3B82F6"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                    </div>
                    <div class="btn-text">
                        <span class="btn-title">QQ售后群</span>
                        <span class="btn-subtitle">点击加入群聊</span>
                    </div>
                </div>
                <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </a>

            <!-- Telegram 售后 -->
            <a href="#" class="glass-button">
                <div class="btn-left">
                    <div class="icon-wrapper">
                        <!-- 纸飞机图标 -->
                        <svg viewBox="0 0 24 24" fill="#3B82F6"><path d="M21.3 3.7L2.7 10.7c-1.1.4-1.1 1.9 0 2.3l4.6 1.5 1.8 5.8c.3 1 1.6 1.2 2.2.3l2.5-3.3 4.6 3.4c.9.7 2.1.2 2.4-.9l3.8-14.5c.3-1.1-.8-2.1-1.9-1.6zM8.6 13.7l8.9-5.7-7.3 6.7-.3 3.4-1.3-4.4z"/></svg>
                    </div>
                    <div class="btn-text">
                        <span class="btn-title">Telegram 售后</span>
                        <span class="btn-subtitle">点击联系客服</span>
                    </div>
                </div>
                <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </a>

        </div>
    </div>

</body>
</html>
