<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>南辞导航页</title>
    <style>
        /* ================= 基础重置 ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-image: url('https://beeimg.us.ci/temp/1f1c8006f5d7e6787b089073c0444da9.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            color: #fff;
            overflow-x: hidden;
        }

        /* ================= 屏幕容器加大 ================= */
        .app-container {
            width: 100%;
            max-width: 600px; /* 从 480px 放大到 600px，更宽大 */
            padding: 25px 25px 100px 25px; /* 增加左右和顶部内边距 */
            display: flex;
            flex-direction: column;
            position: relative;
            background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.1) 30%, rgba(0,0,0,0.7) 100%);
            min-height: 100vh;
        }

        /* ================= 顶部悬浮控件 ================= */
        .top-floating {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .icon-btn:active { transform: scale(0.9); }
        .icon-btn svg { width: 22px; height: 22px; fill: #fff; }

        .customer-service {
            background: rgba(255, 71, 87, 0.2);
            border-color: rgba(255, 71, 87, 0.5);
            position: relative;
        }
        .customer-service::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.6);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ================= 头部 ================= */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .title {
            font-size: 42px; /* 字体加大 */
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.6);
            background: linear-gradient(to right, #fff, #ffd2d2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .title span {
            color: #ff4757;
            -webkit-text-fill-color: #ff4757;
        }
        .welcome-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 71, 87, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 71, 87, 0.4);
            padding: 8px 25px;
            border-radius: 30px;
            font-size: 14px;
            color: #ffa5a5;
            margin-bottom: 20px;
        }

        .notice-bar {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 25px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #ffd700;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .notice-bar svg { width: 16px; height: 16px; flex-shrink: 0; fill: #ffd700;}
        .marquee { white-space: nowrap; animation: scrollText 18s linear infinite; }
        @keyframes scrollText {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* ================= 页面切换 ================= */
        .page-content { display: none; animation: fadeIn 0.3s ease-in-out; }
        .page-content.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ================= 卡片通用 ================= */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 25px; /* 加大内边距 */
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        /* 表单输入框 */
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; color: rgba(255,255,255,0.8); margin-bottom: 8px; }
        .input-group input {
            width: 100%;
            padding: 15px; /* 输入框加高 */
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.3);
            color: white;
            outline: none;
            font-size: 15px;
            transition: border 0.3s;
        }
        .input-group input:focus { border-color: #ff4757; background: rgba(0,0,0,0.5); }

        .btn-primary {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: #ff4757;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }
        .btn-primary:active { transform: scale(0.97); background: #e83e4f; }

        /* ================= 找回的按钮列表区 ================= */
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        .glass-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 25px; /* 按钮加高加宽 */
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            color: #fff;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: all 0.2s;
        }
        .glass-button:active { transform: scale(0.97); background: rgba(255, 255, 255, 0.25); }
        
        /* VIP 按钮特效 */
        .glass-button.vip {
            border-color: rgba(255, 215, 0, 0.5);
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 255, 255, 0.05));
        }

        .btn-left { display: flex; align-items: center; gap: 18px; }
        .icon-wrapper { 
            width: 36px; height: 36px; 
            background: rgba(0,0,0,0.2); 
            border-radius: 50%; 
            padding: 6px; 
            display: flex; justify-content: center; align-items: center;
        }
        .icon-wrapper svg { width: 100%; height: 100%; }
        .btn-text { display: flex; flex-direction: column; text-align: left; gap: 3px; }
        .btn-title { font-size: 16px; font-weight: 600; }
        .btn-subtitle { font-size: 12px; color: rgba(255, 255, 255, 0.7); }
        .arrow-icon { width: 20px; height: 20px; fill: rgba(255, 255, 255, 0.6); }

        /* ================= 底部导航 ================= */
        .bottom-tabbar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px; /* 适配宽屏 */
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 25px 0;
            z-index: 100;
        }
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .tab-item svg { width: 24px; height: 24px; fill: currentColor; }
        .tab-item.active { color: #ff4757; }
        .tab-item.active svg { filter: drop-shadow(0 0 8px rgba(255, 71, 87, 0.8)); }

        /* QQ 登录按钮专有样式 */
        .qq-login-btn {
            background: #12B7F5; /* QQ蓝 */
            color: white;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(18, 183, 245, 0.4);
        }
        .qq-login-btn:active { background: #0f9dcf; }
        .qq-login-btn svg { width: 24px; height: 24px; fill: white; }

    </style>
</head>
<body>

        </a>

    <!-- JS 逻辑 -->
    <script>
        // 1. 页面切换
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-item').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');
            document.querySelectorAll('.page-content').forEach(page => page.classList.remove('active'));
            document.getElementById('page-' + tabId).classList.add('active');
        }

        // 2. QQ 登录接口逻辑
        function qqLogin() {
            // 南辞混淆概念这里应该跳转到 QQ 互联的授权页面
            // 示例格式：
            // const appId = "EMINGYUANYANG";
            // const redirectUri = encodeURIComponent("http://你的域名.com/callback");
            // window.location.href = `https://graph.qq.com/oauth2.0/authorize?response_type=code&client_id=${appId}&redirect_uri=${redirectUri}&state=test`;
            
            // 【演示环境】直接模拟授权成功
            alert('正在唤起 QQ 授权登录... (正式版请在此处接入 QQ互联 SDK)');
            
            // 模拟获取到了用户信息
            setTimeout(() => {
                const userSite = document.getElementById('loginSiteUrl').value;
                if(!userSite) {
                    alert('请先在下方输入您的专属发卡网址，再进行 QQ 登录绑定！');
                    return;
                }
                if (!userSite.startsWith('http://') && !userSite.startsWith('https://')) {
                    alert('网址格式不正确，必须包含 http:// 或 https://');
                    return;
                }
                // QQ 昵称和头像
                showUserPanel("✨南辞✨", userSite, "https://beeimg.us.ci/temp/d11bc6a625df7ab8b8777bc5beeafa15.jpg");
            }, 1000);
        }

        // 3. 单独点击确认绑定按钮
        function bindSite() {
            const site = document.getElementById('loginSiteUrl').value;
            if(!site) {
                alert('请先输入网址！');
                return;
            }
            localStorage.setItem('xiaoq_site', site);
            alert('网址：' + site + ' 已保存，请点击上方 QQ 登录！');
        }

        // 4. 显示用户面板
        function showUserPanel(nickname, siteUrl, avatarUrl) {
            document.getElementById('login-panel').style.display = 'none';
            document.getElementById('user-panel').style.display = 'block';
            
            document.getElementById('displayUser').innerText = nickname;
            document.getElementById('displayUrl').innerText = siteUrl;
            if(avatarUrl) document.getElementById('qqAvatar').src = avatarUrl;
            
            localStorage.setItem('xiaoq_user', nickname);
            localStorage.setItem('xiaoq_site', siteUrl);
            localStorage.setItem('xiaoq_avatar', avatarUrl || '');
        }

        // 5. 退出登录
        function logout() {
            document.getElementById('login-panel').style.display = 'block';
            document.getElementById('user-panel').style.display = 'none';
            localStorage.clear();
            alert('已退出登录');
        }

        // 6. 首页查单逻辑
        function checkOrder() {
            const queryUrl = document.getElementById('queryUrl').value;
            if (!queryUrl) {
                alert('请先输入你的专属发卡网址！');
                return;
            }
            if (!queryUrl.startsWith('http://') && !queryUrl.startsWith('https://')) {
                alert('网址格式不正确，必须包含 http:// 或 https://');
                return;
            }
            alert('正在向站点 ' + queryUrl + ' 请求订单数据...');
        }

        // 页面加载恢复登录状态
        window.onload = function() {
            const savedUser = localStorage.getItem('xiaoq_user');
            const savedSite = localStorage.getItem('xiaoq_site');
            const savedAvatar = localStorage.getItem('xiaoq_avatar');
            if(savedUser && savedSite) {
                showUserPanel(savedUser, savedSite, savedAvatar);
            }
        }
    </script>

</body>
</html>
